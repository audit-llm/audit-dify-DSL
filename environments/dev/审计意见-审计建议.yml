        - id: a5e14dc6-7a87-473e-9a45-6a33decd2ee0
          role: user
          text: '参照模板：

            四、审计建议：

            (一)切实加强自然资源资产管理，促进自然资源节约集约利用。严格履行自然资源资产管理和生态环境保护责任，维护自然资源管理秩序。加强对已批闲置土地的清理和整改，加强对临时用地的审批和监管，进一步规范用地行为，合理利用土地资源。

            (二)强化水环境质量保护意识，进一步提高生态环境质量。加强对污水处理厂的监督检查，督促其规范运行、达标排放;提高污水的收集率，加快污泥处置设施建设进度，确保污水集中收集处理;规范农村饮水水质检查工作，确保饮水安全。

            (三)强化资源环境监管执法，认真整改落实。{{#1768893020125.audited_unit#}}应积极配合相关单位做好环境监督执法工作，特别是加大对违法占用耕地、基本农田行为的执法力度，要坚决采取有效措施，杜绝以罚代管的行为。督促辖区内各单位严格遵守生态保护法律法规，规范完善关于执法没收物资的处罚处置标准，认真落实审计问题整改。

            {{#1768893020125.audited_unit#}}应组织有关部门和单位，切实抓好对审计发现问题的整改纠正，并在收到审计意见之日起90日内将整改结果函告省审计厅。

            某同志和{{#1768893020125.audited_unit#}}如果对本意见有异议，可以自收到本意见之日起30日内，向省委审计委员会办公室申诉。省委审计委员会办公室自收到申诉之日起90日内提出复查意见，报省委审计委员会批准后作出复查决定。复查决定为最终决定。'
