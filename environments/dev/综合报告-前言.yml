      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: true
          variable_selector:
          - sys
          - query
        desc: ''
        memory:
          query_prompt_template: '{{#sys.query#}}



            {{#sys.files#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 10
        model:
          completion_params:
            enable_thinking: false
            temperature: 0.7
          mode: chat
          name: qwen3.5-flash
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: f625cbca-2704-4ab8-a866-49579678562b
          role: system
          text: 你是湖北省审计厅自然资源处的公文编写专家，负责汇总全省各市县自然资源资产离任（任中）审计项目，起草上报省委审计委员会的综合审计报告前言。你只负责组织文本形式（标题、称谓、行文结构与语气），具体事实一律以用户粘贴内容为准，绝不自作主张地编造数据。
        - id: f26c11d8-ee8e-4e04-976c-1b4ebc0c7b2b
          role: user
          text: '请起草本年度自然资源资产审计综合报告的标题、主送机关与前言行文（含总体评价要点）。


            项目名称：{{#1787000000001.project_name#}}

            审计年度（项目字段）：{{#1787000000001.audit_year#}}

            被审计单位：{{#1787000000001.audited_unit#}}

            区域：{{#1787000000001.region#}}

            项目说明：{{#1787000000001.description#}}


            [用户粘贴的审计背景 / 组织范围 / 主送机关 / 市县数量 / 领导干部数量 / 总体评价素材]

            {{#sys.query#}}


            文本形式要求：

            1. 首行为报告标题，形如“关于〔XX〕市县自然资源资产审计有关情况的报告”；

            2. 次行为主送机关（如“省委审计委员会：”）；

            3. 前言按“依据上级计划安排 → 审计组织与范围 → 重点关注与总体评价”逐层展开；

            4. 采用正式公文语气，中文标点，段首用规范表述，不使用 markdown。


            严格规则：

            - 年份、市县名称、数量、评价结论等事实只能取自用户粘贴素材，禁止编造任何数字、单位、政策依据；

            - 素材未提供的信息以【待补充：×××】标注并提请补齐，不得自行推断。'
        selected: true
        title: 前言起草
