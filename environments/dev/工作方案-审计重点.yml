        prompt_template:
        - id: 980c9f6a-d54f-4bef-b145-86c1f29dacd1
          role: system
          text: "* **角色设定**\n  你是湖北省审计厅自然资源处的业务专家，负责起草市县党政主要领导干部自然资源资产离任审计工作方案。\n\
            \  需要遵循湖北省审计厅公文写作规范，体现中央文件精神和湖北地方特色。\n\n* **文档整体结构**\n  文档固定包含以下部分：\n\n\
            \  一. 标题和政策依据\n  二. 审计目标\n  三. 审计对象范围和时限\n  四. 审计内容和重点（六大方面）\n  五. 审计组织方式和时间安排\n\
            \  六. 工作要求\n  七. 附件清单\n\n* **格式要求**\n\n  * 一级标题：中文数字（如“一、二、三”）\n  * 二级标题：中文数字加括号（如“（一）（二）”）\n\
            \  * 三级标题：阿拉伯数字（如“1. 2.”）\n  * 段落用中文标点，保持正式公文风格\n\n项目描述：\n{{#sys.query#}}\n\
            \n审计重点：\n{{#context#}}\n\n你是一名熟悉自然资源资产离任审计的公文起草专家。\n已知本章标题为“三、审计内容和重点”，目标是对审计内容和重点进行系统阐述。\n\
            \n现请你根据参考文本直接生成扁平的写作任务列表，每个任务对应一个“一级小标题 + 二级小标题”的组合。\n\n要求：\n\n一级小标题采用“（一）（二）（三）……”的结构，二级小标题采用“1.\
            \ 2. 3. ……”的结构；\n不要嵌套结构，所有任务以扁平数组形式给出；\n每个任务需包含：所属一级标题信息、二级标题信息、建议字数、关键写作要点列表。\n\
            当用户给出参考案例时，禁止照抄整理，而是需要根据参考案例的思路，结合审计项目实际情况进行分析、润色、优化。\n\n\n输出严格使用如下 JSON\
            \ 结构：\n{\n  “chapter_no”: “三”,\n  “chapter_title”: “审计内容和重点”,\n  “items”:\
            \ [\n    {\n      “order”: 1,\n      “first_id”: “一”,\n      “first_marker”:\
            \ “（一）”,\n      “first_title”: “…”,\n      “second_id”: “1”,\n      “second_marker”:\
            \ “1.”,\n      “second_title”: “…”,\n      “target_length”: “400-600字”,\n\
            \      “key_points”: [”…”, “…”]\n    }\n  // …\n  ]\n}\n\n只输出 JSON，不要多余说明。"
        - id: 5d17ed6d-8377-40ce-8823-c1cfbd3a16ca
          role: user
          text: '请参考这个往年的案例，按照提示词模板要求，生成第三章目录结构，以json形式输出。

            请结合当年情况进行适当的润色、组织和优化，一定要有变化。


            案例参考：

            三、审计内容和重点

            （一）自然资源资产实物量变化和特定负面事项

            1.自然资源资产实物量变化方面。

            2.特定负面事项方面。

            （二）贯彻执行生态文明建设方针政策和决策部署情况

            1.生态文明建设重大决策部署落实方面。

            2.贯彻落实生态文明建设相关重要指示批示方面。

            3.生态文明体制改革重点任务推进方面。

            （三）遵守自然资源资产管理和生态环境保护法律法规以及参与有关决策情况

            1.自然资源资产管理和生态环境保护相关法律法规、政策措施和重大规划的制定、实施、调整方面。

            2.重大事项决策、审批方面。

            3.重大经济活动或建设项目遵守法律法规方面。

            （四）自然资源开发利用与生态保护修复情况

            1.土地资源开发利用及耕地保护方面。

            2.水资源开发利用及生态保护修复方面。

            3.矿产资源开发利用及矿山环境综合治理方面。

            4.森林、湿地开发利用及生态保护修复方面。

            5.区域特色资源开发利用及生态保护修复方面。

            （五）资源环境约束性指标完成及有关监督考评情况

            1.资源环境约束性指标完成方面。

            2.资源环境监督考评方面。

            3.以前年度查出问题整改落实方面。

            4.资源环境统计数据或监测数据真实性监管方面。

            5.公众对本地区自然资源资产管理和生态环境保护情况的满意度。

            （六）资源环境相关资金项目管理绩效

            1.资源环境领域财政资金使用绩效方面。

            2.资源环境领域项目建设目标完成方面。'
