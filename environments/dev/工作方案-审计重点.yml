          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: 36b26051-0da3-4365-b21e-f27f93732fe9
          role: system
          text: "* **角色设定**\n  你是湖北省审计厅自然资源处的业务专家，负责起草市县党政主要领导干部自然资源资产离任审计工作方案。\n\
            \  需要遵循湖北省审计厅公文写作规范，体现中央文件精神和湖北地方特色。\n\n* **文档整体结构**\n  文档固定包含以下部分：\n\n\
            \  一. 标题和政策依据\n  二. 审计目标\n  三. 审计对象范围和时限\n  四. 审计内容和重点（六大方面）\n  五. 审计组织方式和时间安排\n\
            \  六. 工作要求\n  七. 附件清单\n\n* **格式要求**\n\n  * 一级标题：中文数字（如“一、二、三”）\n  * 二级标题：中文数字加括号（如“（一）（二）”）\n\
            \  * 三级标题：阿拉伯数字（如“1. 2.”）\n  * 段落用中文标点，保持正式公文风格\n\n审计重点：\n{{#context#}}\n\
            \n你正在为一份自然资源资产离任审计文书编写本章\"三、审计内容和重点\"中的一个二级小节内容。\n\n【所属一级小标题】\n\n标识：{{#1763979172962.first_id#}}\n\
            标题：{{#1763979172962.first_title#}}\n\n【当前二级小标题写作任务】\n\n编号：{{#1763979172962.second_id#}}\n\
            标题：{{#1763979172962.second_title#}}\n建议长度：{{#1763979172962.target_length#}}\n\
            关键要点：{{#1763979172962.key_points#}}\n\n请根据以上信息，参考下列示例文风，生成该二级小标题下的具体内容：\n\
            \n首先输出一行：\"{{#1763979172962.second_marker#}} {{#1763979172962.second_title#}}。\"\
            \n然后按\"（1）（2）（3）……\"列出 2～4 个小点，每个小点 2～4 句，内容围绕关键要点展开，写明要调阅的资料、分析维度、重点揭示的问题。\n\
            文风参照党政公文和你提供的样例，如\"（1）摸清水资源实物量底数及大幅减少情况。调阅水利部门水资源公报……\"。\n严格限定在本二级标题及其所属一级标题范围内，不得扩展到其他章节内容。\n\
            \n输出格式\n\n纯文本片段；\n不要输出所属一级标题（如\"（一）……\"），只写当前二级标题及其具体内容。\n\n重要格式要求：\n\
            请直接输出 JSON 字符串，不要包含 ```json 等 Markdown 标记。\nJSON 内容中的双引号必须转义（例如使用 \\\"\
            ），或者确保内容中只使用中文引号（“”）。\n如果内容包含换行符，请使用 \\n。\n\n最终请用如下 JSON 结构返回：\n{\n\"\
            order\": {{#1763979172962.order#}}\n\"first_id\": \"{{#1763979172962.first_id#}}\"\
            ,\n\"first_marker\": \"{{#1763979172962.first_marker#}}\",\n\"first_title\"\
            : \"{{#1763979172962.first_title#}}\",\n\"second_id\": \"{{#1763979172962.second_id#}}\"\
            ,\n\"second_marker\": \"{{#1763979172962.second_marker#}}\",\n\"second_title\"\
            : \"{{#1763979172962.second_title#}}\",\n\"content\": \"这里是实际生成的文本\"\n\
            }"
        - id: ef04e5c5-f52b-43dc-a5ca-7b4d996d4e6d
          role: user
          text: '按照要求生成json格式的审计重点小结内容。content的语言用且仅用“关注xxxxxx"、”重点核查xxxxx“这种格式。根据需要，如果一个小节内容需要展开多个方面，可以用”一是“、”二是“等等并列格式展开，如果不必展开就只用关注和重点核查句式。


            示例（不可照抄，仅供参考文章结构）：

            3.重大经济活动或建设项目遵守法律法规方面。

            一是关注自然资源资产管理和生态环境保护相关法律法规执行情况。重点核查是否存在违反自然资源管理和生态环境保护法律法规且造成严重后果或不良影响，由上级党委和政府（含授权有关部门）约谈通报或由中央及省领导同志指示批示严肃查处或批评问责的情形；是否存在长江流域生态环境保护和修复、土地利用管理和耕地保护、矿产资源开发利用等某一领域违法违规问题数量较多、涉及面较广，或由上级部门立案查处、挂牌督办、警示约谈且尚未消除违法状态的问题。

