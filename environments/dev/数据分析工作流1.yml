    - data:
        context:
          enabled: false
          variable_selector: []
        desc: ''
        model:
          completion_params:
            enable_thinking: false
            temperature: 0.7
          mode: chat
          name: qwen3.5-flash
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: 745e17e8-3026-4d0c-9532-d6895e295792
          role: system
          text: '你是一个自然资源审计数据分析专家，根据用户上传的文档分析数据疑点。

            '
        - id: e96608af-3669-41f5-a373-7e0bae377d14
          role: user
          text: '用户输入：{{#1762798056508.query#}}

            分析这个数据：{{#1762850964553.text#}}


            如果这是一个标准表，可以参考一下的常见问题和审计方法：

            一、 大气污染防治审计（基于表1：环境空气质量）

            核心逻辑： 关注“变差”的趋势和“造假”的可能。

            重点审计问题

            空气质量反弹风险： 重点关注PM2.5、PM10、O3（臭氧）浓度是否呈逐年上升趋势，或优良天数比例是否下降。

            数据异常突变（人为干扰监测）： 某一年数据突然极好，离任后马上变差；或者在国家/省考核的关键月份数据异常“平滑”。

            考核任务未完成： 对比省、市下达的年度空气质量改善目标（如PM2.5浓度控制线），核实是否完成。

            审计方法论

            趋势分析法： 在Excel中对2021-2024年的6项污染物浓度做折线图，直观判断恶化趋势。

            关联比对法： 将表1中的数据与气象部门的风力、降雨数据对比。如果气象条件有利于扩散但数据反而变差，说明减排不力。

            站点核查法： 询问是否有“喷淋降尘”干扰监测站点的行为（如雾炮车长期停在监测点附近）。


            二、 土地与矿产资源审计（基于表2：土地矿产资源）

            核心逻辑： 严守“耕地红线”，严查“无证开采”与“虚假修复”。

            重点审计问题

            耕地“非农化”、“非粮化”： 耕地保有量是否低于目标任务？“当年减少”的耕地去了哪里？是否存在违规占用耕地绿化造林、挖湖造景或建设房屋。

            占补平衡弄虚作假： “当年补充”的耕地数量是否真实？是否存在“占优补劣”（占用水田，补充旱地或石漠化土地）。

            矿山“批少采多”与越界开采： 实际开采量是否远超储量表数据？是否存在无证开采或越界开采。

            废弃矿山修复滞后： “历史遗留矿山”数量长期不减，或“已关闭矿山”未进行实质性生态修复（仅刷绿漆、挂绿网）。

            审计方法论

            图斑比对（关键技术）：

            利用ArcGIS等软件，将土地利用现状图与遥感影像叠加。重点查看图上标为“耕地”的区域，影像上是否呈现为“建筑物”、“树林”或“水坑”。

            逻辑勾稽： 表2的“耕地保有量” + “当年减少” - “当年补充” 应等于下一年的期初数，计算平衡关系是否成立。


            三、 水资源管理审计（基于表3.1河流、3.2湖泊、3.3水库）

            核心逻辑： 关注“以水定产”落实情况及水质“降类”风险。

            重点审计问题

            水质恶化与“断面超标”： 重点看2022-2024年水质类别变化（如由Ⅲ类降为Ⅳ类）。关注是否有劣V类水体长期未消除。

            水域面积萎缩（围湖造地）： 对比表3.2中各年度“湖体面积”，排查是否存在填湖造地、围湖养殖导致湖泊萎缩的问题。

            生态流量不足： 河流、水库是否因过度取水、发电，导致下游断流或未达到最小生态流量。

            饮用水源地隐患： 水库（若为水源地）周边是否存在违规农业种植、网箱养殖或排污口。

            审计方法论

            上下游比对： 对比河流入境断面和出境断面的水质，如果出境水质显著劣于入境水质，说明本区域内存在严重污染源。

            名录核查： 将表内的湖泊名称与《湖北省湖泊保护名录》比对，看是否有遗漏未报的湖泊，是否存在“无名湖”被侵占无人管的情况。


            四、 森林与湿地审计（基于表4：森林资源）

            核心逻辑： 紧盯“林地流失”与“保护区违建”。

            重点审计问题

            林地转为建设用地： 森林总面积、蓄积量是否异常下降？是否存在未经审批将林地转为建设用地（如建光伏、风电项目）。

            自然保护地“缩水”： 自然保护区面积是否逐年减少？是否存在通过调整规划将违建项目“调出”保护区的情况。

            林地与耕地“重叠”： 表4的“森林面积”与表2的“耕地面积”是否存在地块重叠（即一块地在林业局算林地，在自规局算耕地，以此骗取双方补贴或应付考核）。

            审计方法论

            重叠分析（GIS）： 将“林地一张图”图层与“国土三调”耕地数据图层叠加，计算重叠面积，揭示部门数据打架问题。

            影像回溯： 调取历史卫星影像，观察自然保护区核心区内是否新增了人类活动痕迹（道路、房屋）。


            五、 约束性指标审计（基于表5：生态环保约束性指标）

            核心逻辑： 这是“测谎表”，用于校验各部门数据的真实性与考核达标情况。

            重点审计问题

            数据不一致（部门打架）：

            表5的“耕地保有量”是否与表2一致？

            表5的“森林覆盖率”是否与表4一致？

            表5的“空气优良天数”是否与表1一致？

            常见问题： 填表人为完成考核，在表5填报美化后的数据，而各业务科室在分表（表1-4）填报真实数据，导致前后矛盾。

            约束性指标未达标： 直接对比“2024年实际值”与“十四五目标值”。重点关注：万元GDP能耗、碳排放、主要污染物排放量是否完成削减任务。

            突击完成任务： 某些指标（如优良天数、水质达标率）在考核截止前（如12月）突然大幅好转，可能存在人为操作。

            审计方法论

            数据交叉验证表： 建立一张Excel底稿，横向列出表1-4的数据，纵向列出表5的数据，设置公式自动计算差额，差额不为0即为疑点。


            六、 决策与执行审计（基于表6：会议情况）

            核心逻辑： 查“不作为”和“乱作为”。

            重点审计问题

            议而不决、决而不行： 会议纪要中提到的整改要求（如“某月某日前拆除违建”），在“执行进展情况”栏是否长期显示“正在推进”而无实质结果。

            决策违规（让步让利）： 是否存在通过会议纪要，违规减免企业的矿产资源补偿费、土地出让金，或违规批准降低环保标准引进项目。

            生态议题缺失： 统计三年内涉及生态文明建设的议题占比。如果占比极低，说明领导干部对生态责任重视不够。

            审计方法论

            关键词检索： 在会议纪要内容中检索“特事特办”、“暂缓执行”、“减免”、“绿色通道”等敏感词，往往能发现违规开口子的问题。


            七、 制度建设审计（基于表7：出台制度）

            核心逻辑： 查“制度真空”和“照搬照抄”。

            重点审计问题

            制度缺失： 国家或省里已经出台了“林长制”、“河长制”等要求，本地是否在合理期限内出台了具体实施方案？

            制度形式主义： 抽查文件内容，是否存在全文照搬上级文件，连“省政府”字样都没改成“市政府”，或者缺乏本地具体的考核细则。


            八、 数据责任审计（基于表8：电子数据清单）

            核心逻辑： 查“数据孤岛”和“推诿扯皮”。

            重点审计问题

            拒绝提供数据： 某部门在“是否提供”栏选“否”，理由是“涉密”或“无电子数据”。这往往是掩盖问题的借口（除极少数涉密外，自然资源数据应向审计提供）。

            数据质量差： 提供的电子数据缺乏坐标系、字段残缺、年份中断，导致审计无法分析。


            在给出自然语言的分析后，需要附带上整理好的、所有疑点最终都需要用一个表格格式展示疑点清单，表格需要有以下字段：序号 | 地级市名称 | 市县区名称
            | 疑点分类 | 疑点名称 | 问题详述 | 疑似违法法规 | 核实情况（统一填“待核实”） | 备注'
