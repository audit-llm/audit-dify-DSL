    - data:
        code: "import re\n\ndef main(arg1: str) -> dict:\n    text = (arg1 or \"\"\
          )\n\n    # 1) 最稳：优先提取 ```sql ... ``` 代码块里的内容\n    m = re.search(r\"```sql\\\
          s*(.*?)\\s*```\", text, flags=re.IGNORECASE | re.DOTALL)\n    if m:\n  \
          \      return {\"result\": m.group(1).strip()}\n\n    # 2) 兜底：去掉“思考段”——兼容只有\
          \ </think>、或 <think>...</think>、或裸 think 标签\n    # 2.1 去掉完整 think 块（如果有开闭）\n\
          \    text2 = re.sub(r\"<think>.*?</think>\", \"\", text, flags=re.IGNORECASE\
          \ | re.DOTALL)\n\n    # 2.2 如果只有 </think>（没有 <think>），则把它前面的内容都删掉\n    if\
          \ re.search(r\"</think>\", text2, flags=re.IGNORECASE):\n        text2 =\
          \ re.split(r\"</think>\", text2, flags=re.IGNORECASE, maxsplit=1)[-1]\n\n\
          \    # 2.3 兼容无尖括号的 think（例如：think ... </think> 或 think ...）\n    # 如果出现\
          \ \"think\" 但没有 ```sql```，也尽量截断到最后一个 think 结束符后\n    if re.search(r\"\\\
          bthink\\b\", text, flags=re.IGNORECASE) and not m:\n        # 若有 </think>\
          \ 已处理；否则不强行切（避免误伤正文里出现think单词）\n        pass\n\n    text2 = text2.strip()\n\
          \n    # 3) 从 text2 里提取 SQL：抓取第一个 SELECT/WITH 开始到结尾\n    m2 = re.search(r\"\
          (?is)\\b(with|select)\\b.*\", text2)\n    sql = m2.group(0).strip() if m2\
          \ else \"\"\n\n    # 4) 清理残留的代码围栏/多余反引号\n    sql = re.sub(r\"```+\", \"\"\
          , sql).strip()\n\n    return {\"result\": sql}\n"
