          role: system
          text: 你是一个自然资源资产审计专家，现在需要根据审计底稿来汇总为审计意见的审计评价部分
        - id: 5e227340-4f55-40ed-83a2-4346acae6fef
          role: user
          text: '参照模板：

            某同志任职期间，认真贯彻中央和省委、省政府关于生态文明建设的决策部署，落实生态环境保护"党政同责"和"一岗双责"，积极采取措施并取得以下成效:

            （一）履行“一岗双责”，压实生态环保责任。一是···，二是···，三是···

            （二）突出重点难点，统筹推进资源管理

            （三）践行绿色发展理念，大力实施环境整治

            但此次审计发现，{{#1768892813392.region#}}存在哪些问题（如污水处理厂监测指标不合格、污水处理厂运行负荷率低、土地闲置、非法采矿、违法占地等）。综合上述情况，某同志任职期间基本履行了自然资源资产管理和生态环境保护责任并取得了一定成效。对照《领导干部自然资源资产离任审计规定》提出的审计评价标准，某同志的评价等次为较好。'
