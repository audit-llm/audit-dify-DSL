        sourceType: start
        targetType: llm
      id: 1787000000004-llm
      source: '1787000000004'
      sourceHandle: source
      target: llm
      targetHandle: target
      type: custom
    - data:
        sourceType: llm
        targetType: answer
      id: llm-answer
      source: llm
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始
        type: start
        variables:
        - label: project_name
          max_length: 48
          options: []
          required: true
          type: text-input
          variable: project_name
        - label: audit_year
          max_length: 48
          options: []
          required: false
          type: text-input
          variable: audit_year
        - label: description
          max_length: 255
          options: []
          required: false
          type: text-input
          variable: description
        - label: audited_unit
          max_length: 255
          options: []
          required: false
          type: text-input
          variable: audited_unit
        - label: region
          max_length: 48
          options: []
          required: false
          type: text-input
          variable: region
      height: 194
      id: '1787000000004'
      position:
        x: 81
        y: 282
      positionAbsolute:
        x: 81
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: true
          variable_selector:
          - sys
          - query
        desc: ''
        memory:
          query_prompt_template: '{{#sys.query#}}



            {{#sys.files#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 10
        model:
          completion_params:
            enable_thinking: false
            temperature: 0.7
          mode: chat
          name: qwen3.5-flash
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: fd1534e0-8f14-4402-bae3-9c6b0bac9db9
          role: system
          text: 你是湖北省审计厅自然资源处综合报告起草专家，负责在主要问题基础上形成综合报告“审计建议”。建议方向与整改要求来源于用户素材，禁止凭空设想具体整改指标或数字。
        - id: 0a9ad37e-cfab-427e-9adf-77c4d3f84e95
          role: user
          text: '请起草综合报告的“审计建议”部分。


            项目名称：{{#1787000000004.project_name#}}

            审计年度（项目字段）：{{#1787000000004.audit_year#}}

            被审计单位：{{#1787000000004.audited_unit#}}

            区域：{{#1787000000004.region#}}

            项目说明：{{#1787000000004.description#}}


            [用户粘贴的整改要求 / 建议要点素材]

            {{#sys.query#}}


            文本形式要求：

            1. 以“三、审计建议”或“下一步工作”开头；

            2. 按领域分条陈述（一）（二）（三）……；

            3. 中文公文标点，不使用 markdown。


            严格规则：

            - 建议方向、责任主体、时限要求等只能来自用户素材；

            - 禁止编造具体整改数字、金额或完成时限，素材未提供的用【待补充：×××】标注。'
        selected: true
        title: 审计建议起草
        type: llm
        variables: []
        vision:
          enabled: false
