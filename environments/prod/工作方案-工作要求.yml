            五、工作要求


            （一）提高政治站位，做实研究确保审计质量。领导干部自然资源资产离任审计是习近平总书记亲自关心和领导下实施的重要改革举措，是党中央、国务院推进生态文明建设的重大决策部署。各审计组要提高政治站位，本着对审计事业、对领导干部负责任的态度开展审计工作，在推进生态文明建设责任制落实、推动领导干部切实履行自然资源资产管理和生态环境保护责任方面发挥应有作用。自然资源审计内容广泛，参审人员要认真学习研究政策法规和相关规划，聚焦主责主业，理清思路方法，审计组内部要加强沟通协调，做到优势互补，牢固树立"有问题没发现是失职，发现问题不报告是渎职"意识，如实、完整反映审计发现的问题。


