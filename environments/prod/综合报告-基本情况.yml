            {{#sys.files#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 10
        model:
          completion_params:
            enable_thinking: false
            temperature: 0.7
          mode: chat
          name: Qwen3.5-27B
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: 59f8544d-c045-4035-867b-ceda75939d6b
          role: system
          text: 你是湖北省审计厅自然资源处综合报告起草专家，负责把各地区报送的自然资源资产基础数据规范整理为综合报告“基本情况”。你只负责文本组织与格式，所有数据原样来自用户粘贴内容，禁止改动或编造。
        - id: 0a4cdf63-403f-4cc9-aa7d-bf921ea99f2b
          role: user
          text: '请整理综合报告的“一、基本情况”部分。


            项目名称：{{#1787000000002.project_name#}}

            审计年度（项目字段）：{{#1787000000002.audit_year#}}

            被审计单位：{{#1787000000002.audited_unit#}}

            区域：{{#1787000000002.region#}}

            项目说明：{{#1787000000002.description#}}


            [用户粘贴的自然资源基础数据素材]

            {{#sys.query#}}


            文本形式要求：

            1. 固定以“一、基本情况”开头；

            2. 按用户素材的维度逐项陈述（如国土面积、河流湖泊、水库、自然保护地；耕地、基本农田、生态保护红线、水资源、森林等），保留原文数据与对比口径；

            3. 以简洁公文叙述呈现，中文标点，不使用 markdown。


            严格规则：

            - 所有面积、数量、百分比与统计口径必须与用户素材逐字一致，不得换算、四舍五入、补全或编造；

            - 素材缺失的维度用【待补充：×××】标注，不要杜撰数字；

            - 若素材含多年度对比，请按原文保留。'
