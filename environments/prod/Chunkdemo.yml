    - data:
        code: "def main(text: str) -> dict:\n    text = str(text) if text else \"\"\
          \n    text_length = len(text)\n    \n    if not text.strip():\n        return\
          \ {\"chunks\": [], \"text_length\": 0}\n        \n    # 【核心修改 1：降低分块大小，防超时，提精度】\n\
          \    # 将 4000 降为 1200。这样 32B 模型处理每一块只需十几秒，绝不超时，且找错别字极其精细。\n    chunk_size\
          \ = 4000  \n    overlap = 400      \n    \n    # 【核心修改 2：调整单页字符估算补偿】\n \
          \   # 标书里有大量表格、图片、留白，它们占物理页码但不占纯文本字数。\n    # 调低单页字符数到 750，估算出的页码会更贴近真实的\
          \ PDF 页码。\n    chars_per_page = 750 \n    \n    chunks = []\n    start =\
          \ 0\n    \n    while start < text_length:\n        end = min(start + chunk_size,\
          \ text_length)\n        chunk_text = text[start:end]\n        \n       \
          \ # 1. 预估物理页码\n        start_page = int(start / chars_per_page) + 1\n  \
          \      end_page = int(end / chars_per_page) + 1\n        \n        # 【核心修改\
          \ 3：引入绝对定位（全文百分比）】\n        # 无论 PDF 怎么排版，百分比是绝对的。审计员找不到时直接拉动 PDF 滚动条到对应百分比位置。\n\
          \        percent_start = int((start / text_length) * 100)\n        percent_end\
          \ = int((end / text_length) * 100)\n        \n        # 组装双轨坐标\n       \
          \ page_locator = f\"[全文进度 {percent_start}%-{percent_end}% | 预估第 {start_page}-{end_page}\
          \ 页]\"\n        \n        chunks.append({\n            \"page_locator\"\
          : page_locator,\n            \"content\": chunk_text\n        })\n     \
          \   start += (chunk_size - overlap)\n        \n    return {\n        \"\
          chunks\": chunks,\n        \"text_length\": text_length\n    }"
        code_language: python3
        desc: ''
        outputs:
          chunks:
            children: null
            type: array[object]
          text_length:
            children: null
            type: number
