            3. 身份打码：你必须在所有提取结果的 source_file 字段中，强制、死板地填写 \"中标单位A\"，绝不允许更改！\n   - 【重点新增】：提取极具个性化的“长难句”或“非标准化的工艺描述”（字数在20-50字之间）。哪怕没有错别字，只要这句话不像通用的官方废话，就提取出来作为比对指纹！\n\
            \   - 必须原封不动复制原句，并附上 page_locator。若无，输出 []。\n\n⚠️ 绝对不可自己创造词汇！你的提取内容必须能在原文中通过\
            \ Ctrl+F 搜索到！"
