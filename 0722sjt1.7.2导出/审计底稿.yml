    - data:
        code: "import re\n\ndef main(llm_raw_output: str) -> dict:\n    \"\"\"\n \
          \   清洗大模型输出，移除 <think>...</think> 思考过程\n    \"\"\"\n    # 如果输入为空，直接返回空\n\
          \    if not llm_raw_output:\n        return {\"result\": \"\"}\n    \n \
          \   # 正则表达式匹配 <think> 标签及其内容\n    # re.DOTALL 模式确保 . 可以匹配换行符\n    pattern\
          \ = r\"<think>.*?</think>\"\n    \n    # 将匹配到的内容替换为空字符串\n    cleaned_text\
          \ = re.sub(pattern, \"\", llm_raw_output, flags=re.DOTALL)\n    \n    #\
