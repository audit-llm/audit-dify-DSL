          text: '生成要求：

            1. 标题格式固定为"{{#1764576470261.year#}}年{{#1764576470261.region#}}党政主要领导干部自然资源资产离任（任中）审计实施方案"

            2. 必须引用鄂审计委办经责通最新文件，包含文号；引用《中华人民共和国国家审计准则》

            3. 必须引用本年度工作方案名称：固定为{{#1764576470261.year#}}市县党政主要领导干部自然资源资产离任（任中）审计工作方案

            4. 结尾统一表述为"结合前期对/数据采集、分析和调查的情况，制定本审计实施方案"

            5. 严格遵照{{#1764576501388.text#}}的内容得到文件名，不要瞎编

            参照模板：请参照，并不是照搬

            2025年洪湖市党政主要领导干部自然资源资产离任（任中）审计实施方案

            根据《关于开展某同志任某职、某同志任某职期间履行经济责任和自然资源资产离任（任中）审计的通知》（鄂审计委办经责通〔2025〕16号）的要求，自2025年2月13日起，省委审计委员会办公室、省审计厅派出审计组对A、B同志开展领导干部自然资源资产离任（任中）审计。按照《中华人民共和国国家审计准则》和《2025年市县党政主要领导干部自然资源资产离任（任中）审计工作方案》的要求，结合前期对XX市数据采集、分析和调查的情况，制定本审计实施方案。'
