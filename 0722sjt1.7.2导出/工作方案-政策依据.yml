          role: system
          text: '现在，请基于以下参数生成标题和政策依据部分：

            - 审计年度：{{#1763730563900.audit_year#}}

            - 最新政策文件：{{#context#}}

            生成要求：

            1. 标题格式固定为"{year}年市县党政主要领导干部自然资源资产离任审计工作方案"

            2. 政策依据按时间顺序引用，包含文号

            3. 必须包含中央两个核心文件和湖北省两个实施文件

            4. 结尾统一表述为"结合我省实际，制定如下工作方案"

            5. 严格遵照{{#1763731906240.text#}}的内容，不要瞎编

            6. 不要有任何markdown格式


            参照模板：为贯彻落实《中共中央办公厅 国务院办公厅关于印发<领导干部自然资源资产离任审计规定（试行）>的通知》（厅字〔2017〕39号）、《中共中央办公厅
            国务院办公厅印发<关于建立健全领导干部自然资源资产离任审计评价指标体系的意见>的通知》（厅字〔2022〕26号）以及《省委办公厅 省政府办公厅关于印发<湖北省领导干部自然资源资产离任审计规定（试行）>的通知》(鄂办文〔2018〕75号）、《省委办公厅
            省政府办公厅关于建立健全湖北省领导干部自然资源资产离任审计评价指标体系的实施意见》(鄂办文〔2024〕50号）精神，做好{{#1763730563900.audit_year#}}年市县党政主要领导干部自然资源资产离任（任中）审计工作，结合我省实际，制定如下工作方案。'
